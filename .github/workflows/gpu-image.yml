name: Build pinned GPU image
on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - "bootstrap/**"
      - "experiments/run_v3_vggt.py"
      - "experiments/export_gsplat_cameras.py"
      - "scripts/execute_v3_workspace.py"
      - "scripts/cache_vggt_checkpoint.py"
      - ".github/workflows/gpu-image.yml"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/scene-reconstruction-gpu
          # TEMPORARY: validating the second-pass (pycache/source-bloat) size
          # optimization under its own tag before promoting it. v3-pt24-cu124-gsplat153
          # (still untouched) and v3-pt24-cu124-gsplat153-slim (the RunPod-validated
          # pass-1 result) both stay available as rollback targets. Revert this tag
          # list once this candidate is validated and promoted.
          tags: |
            type=raw,value=v3-pt24-cu124-gsplat153-slim-v2
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
