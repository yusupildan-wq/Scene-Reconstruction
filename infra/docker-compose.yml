services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scene
      POSTGRES_PASSWORD: scene
      POSTGRES_DB: scene
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scene"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      DATABASE_URL: postgresql+asyncpg://scene:scene@postgres:5432/scene
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data/storage
      GPU_BACKEND: local
      LOCAL_DEMO_SCENE_PLY: /demo/v3_scene.ply
      LOCAL_DEMO_CAMERAS_JSON: /demo/v3_scene_cameras.json
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      - backend_storage:/data/storage
      - ../frontend/public:/demo:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
